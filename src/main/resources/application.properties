spring.application.name=get-all-orders-service
server.port=${PORT:9083}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:hibernate}

spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

#for hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


eureka.instance.hostname= localhost
eureka.client.register-with-eureka= true 
eureka.client.fetch-registry= true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/abc

# If 50% of the last 10 requests fail, open the circuit
resilience4j.circuitbreaker.instances.orderingService.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderingService.failure-rate-threshold=50

# Wait 10 seconds in OPEN state before trying to route traffic again (HALF-OPEN)
resilience4j.circuitbreaker.instances.orderingService.wait-duration-in-open-state=10000

# Total number of attempts (1 original call + 2 retries)
resilience4j.retry.instances.orderingService.max-attempts=3
# Wait 2 seconds (2000 ms) before trying again
resilience4j.retry.instances.orderingService.wait-duration=10000

# Allow a maximum of 3 calls
resilience4j.ratelimiter.instances.orderingService.limit-for-period=3
# The refresh period window (10 seconds)
resilience4j.ratelimiter.instances.orderingService.limit-refresh-period=10s
# If a request gets blocked, how long should it wait in line before failing immediately (0 means fail instantly)
resilience4j.ratelimiter.instances.orderingService.timeout-duration=50ms
# Enable an event consumer buffer size of 10 events i.e. history
resilience4j.ratelimiter.instances.orderingService.subscribe-for-events=true
resilience4j.ratelimiter.instances.orderingService.event-consumer-buffer-size=30


#zip-kin instrumentation
management.tracing.sampling.probability= 1.0

spring.cloud.openfeign.micrometer.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:9411/v1/traces

resilience4j.circuitbreaker.circuit-breaker-aspect-order=101
